# Hyperlabs CI: runs on every pull request to main.
# Same steps as the upstream "Continuous Integration Play" job (continuous_integration.yml in WorkAdventure).
name: Hyperlabs CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hyperlabs-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  play:
    name: "CI play"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v5

      - name: "Setup NodeJS"
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "3.x"

      - name: "Install dependencies"
        run: npm ci --workspace=workadventure-play

      - name: "Install messages dependencies"
        run: npm ci
        working-directory: "messages"

      - name: "Build proto messages"
        run: npm run ts-proto
        working-directory: "messages"

      - name: "Generate i18n files"
        run: npm run typesafe-i18n
        working-directory: "play"

      - name: "Check translations completeness"
        run: npm run i18n:check
        working-directory: "play"

      - name: "Build"
        run: npm run build
        env:
          PUSHER_URL: "//localhost:3000"
          ADMIN_URL: "//localhost:80"
          NODE_OPTIONS: --max-old-space-size=16384
        working-directory: "play"

      - name: "Build iframe-api"
        run: npm run build-iframe-api
        working-directory: "play"

      - name: "Typecheck"
        run: npm run typecheck
        working-directory: "play"

      - name: "Svelte check"
        run: npm run svelte-check
        working-directory: "play"

      - name: "Lint"
        run: npm run lint
        working-directory: "play"

      - name: "Pretty"
        run: npm run pretty-check
        working-directory: "play"

      - name: "Unit tests"
        run: npm test
        working-directory: "play"
