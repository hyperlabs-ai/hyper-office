# Hyperlabs deploy: every merge to main that touches the play image is built for arm64,
# pushed to Amazon ECR and rolled out on the EC2 through SSM Run Command (no SSH, no AWS keys in GitHub).
# Setup and runbook: docs/hyperlabs/deploy-aws.md
name: Hyperlabs deploy (AWS)

on:
  push:
    branches: [main]
    paths:
      - "play/**"
      - "libs/**"
      - "messages/**"
      - "patches/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hyperlabs-deploy.yml"
  workflow_dispatch:

concurrency:
  group: hyperlabs-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC to AWS
  contents: read

env:
  AWS_REGION: mx-central-1
  ECR_REPOSITORY: hyper-office/play
  INSTANCE_NAME: hyper-office
  PUBLIC_URL: https://office.hyperhub.mx/

jobs:
  build:
    name: "Build play image"
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: play/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha

  deploy:
    name: "Deploy to EC2"
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "Run deploy.sh on the EC2 through SSM"
        run: |
          IID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Instance: $IID"
          CMD=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --comment "deploy play $TAG" \
            --parameters "commands=[\"/opt/hyper-office/deploy.sh $TAG\"]" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD"
          STATUS=Pending
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$IID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "Status: $STATUS"
          test "$STATUS" = "Success"

      - name: "Smoke test"
        run: curl -fsS --retry 5 --retry-delay 5 "$PUBLIC_URL" | grep -q "<title>Hyperlabs Office</title>"
